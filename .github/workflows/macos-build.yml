name: macOS Build

on:
  push:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish complete macOS .app ZIP to GitHub Releases"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      release_tag:
        description: "Release tag to create/update when publishing"
        required: true
        default: "mac-latest"
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install cmake sdl2 sdl2_image sdl2_ttf jpeg curl

      - name: Build (release)
        run: make release NPROCS=3

      - name: Download Data pack from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p /tmp/darkeden-data/extract
          echo "Downloading Data-mac.zip from release data-mac-v1..."
          gh release download data-mac-v1 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "Data-mac.zip" \
            --dir /tmp/darkeden-data \
            --clobber
          test -f /tmp/darkeden-data/Data-mac.zip
          ls -lh /tmp/darkeden-data/Data-mac.zip
          echo "Extracting Data-mac.zip and normalizing paths..."
          python3 - <<'PY'
          import os
          import shutil
          import sys
          import zipfile

          zip_path = "/tmp/darkeden-data/Data-mac.zip"
          normalized_root = "/tmp/darkeden-data/normalized"
          data_out = os.path.join(normalized_root, "Data")

          shutil.rmtree(normalized_root, ignore_errors=True)
          os.makedirs(normalized_root, exist_ok=True)

          extracted = 0
          skipped = 0
          first_names = []

          with zipfile.ZipFile(zip_path) as zf:
              for info in zf.infolist():
                  raw_name = info.filename
                  if len(first_names) < 80:
                      first_names.append(raw_name)

                  # ZIPs made on Windows can store backslashes as literal
                  # characters. macOS unzip/ditto may then fail to create the
                  # Data directory shape we need. Normalize both separators.
                  name = raw_name.replace("\\", "/").lstrip("/")
                  parts = [part for part in name.split("/") if part and part not in (".", "..")]
                  lower_parts = [part.lower() for part in parts]

                  if "data" not in lower_parts:
                      skipped += 1
                      continue

                  data_index = lower_parts.index("data")
                  rel_parts = parts[data_index:]
                  if not rel_parts:
                      skipped += 1
                      continue

                  out_path = os.path.join(normalized_root, *rel_parts)
                  if info.is_dir() or raw_name.endswith(("/", "\\")):
                      os.makedirs(out_path, exist_ok=True)
                      continue

                  os.makedirs(os.path.dirname(out_path), exist_ok=True)
                  with zf.open(info) as src, open(out_path, "wb") as dst:
                      shutil.copyfileobj(src, dst)
                  extracted += 1

          print(f"Extracted Data files: {extracted}")
          print(f"Skipped non-Data entries: {skipped}")
          if not os.path.isdir(data_out) or extracted == 0:
              print("ERROR: Could not find/extract a Data folder in Data-mac.zip")
              print("First ZIP entries:")
              for name in first_names:
                  print(f"  {name}")
              sys.exit(1)
          PY
          rm -rf Patch/mac/Data
          mv /tmp/darkeden-data/normalized/Data Patch/mac/Data
          echo "Data folder ready:"
          du -sh Patch/mac/Data

      - name: Package macOS app
        run: |
          chmod +x tools/package_macos_app.sh
          tools/package_macos_app.sh

      - name: Upload complete macOS app package
        uses: actions/upload-artifact@v4
        with:
          name: DarkEden-Classic-macOS-app
          path: build/package/macos/DarkEden-Classic-macOS-arm64.zip
          if-no-files-found: warn

      - name: Publish complete macOS app release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -e
          ZIP_PATH="build/package/macos/DarkEden-Classic-macOS-arm64.zip"
          test -f "$ZIP_PATH"
          ls -lh "$ZIP_PATH"

          cat > /tmp/darkeden-macos-release-notes.md <<'NOTES'
          # DarkEden Classic macOS

          Pacote completo para macOS Apple Silicon.

          Inclui:
          - DarkEden Classic.app
          - Updater
          - Client
          - Data completa
          - bibliotecas SDL2 embutidas

          Como usar:
          1. Baixe `DarkEden-Classic-macOS-arm64.zip`.
          2. Extraia o ZIP.
          3. Abra `DarkEden Classic.app`.

          Se o macOS bloquear:

          ```bash
          xattr -dr com.apple.quarantine "DarkEden Classic.app"
          open "DarkEden Classic.app"
          ```

          Observacao: este pacote e ad-hoc signed, mas ainda nao e notarizado pela Apple.
          NOTES

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Updating existing release: $RELEASE_TAG"
            gh release upload "$RELEASE_TAG" "$ZIP_PATH" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "DarkEden Classic macOS" \
              --notes-file /tmp/darkeden-macos-release-notes.md
          else
            echo "Creating release: $RELEASE_TAG"
            gh release create "$RELEASE_TAG" "$ZIP_PATH" \
              --repo "$GITHUB_REPOSITORY" \
              --title "DarkEden Classic macOS" \
              --notes-file /tmp/darkeden-macos-release-notes.md
          fi

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build/release/CMakeFiles/CMakeOutput.log
          if-no-files-found: ignore
