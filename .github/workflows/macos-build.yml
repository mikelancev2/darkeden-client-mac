name: macOS Build

on:
  push:
    branches: [ master ]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install cmake sdl2 sdl2_image sdl2_ttf jpeg curl

      - name: Build (release)
        run: make release NPROCS=3

      - name: Download Data pack from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p /tmp/darkeden-data/extract
          echo "Downloading Data-mac.zip from release data-mac-v1..."
          gh release download data-mac-v1 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "Data-mac.zip" \
            --dir /tmp/darkeden-data \
            --clobber
          test -f /tmp/darkeden-data/Data-mac.zip
          ls -lh /tmp/darkeden-data/Data-mac.zip
          echo "Extracting Data-mac.zip..."
          ditto -x -k /tmp/darkeden-data/Data-mac.zip /tmp/darkeden-data/extract
          if [ -d /tmp/darkeden-data/extract/Data ]; then
            rm -rf Patch/mac/Data
            mv /tmp/darkeden-data/extract/Data Patch/mac/Data
            echo "Data folder ready:"
            du -sh Patch/mac/Data
          else
            echo "Data-mac.zip did not contain a top-level Data folder. Contents:"
            find /tmp/darkeden-data/extract -maxdepth 2 -type d | head -50
            if [ -d /tmp/darkeden-data/extract/mac/Data ]; then
              rm -rf Patch/mac/Data
              mv /tmp/darkeden-data/extract/mac/Data Patch/mac/Data
              echo "Data folder ready from mac/Data:"
              du -sh Patch/mac/Data
            else
              echo "ERROR: Could not find Data folder in Data-mac.zip"
              exit 1
            fi
          fi

      - name: Package macOS app
        run: |
          chmod +x tools/package_macos_app.sh
          tools/package_macos_app.sh

      - name: Upload complete macOS app package
        uses: actions/upload-artifact@v4
        with:
          name: DarkEden-Classic-macOS-app
          path: build/package/macos/DarkEden-Classic-macOS-arm64.zip
          if-no-files-found: warn

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build/release/CMakeFiles/CMakeOutput.log
          if-no-files-found: ignore
